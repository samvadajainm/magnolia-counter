<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magnolia Plant Counter</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f0f4f3;
            color: #1a2e1a;
            min-height: 100vh;
            padding: 2rem 1rem;
        }

        .container {
            max-width: 720px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        header h1 {
            font-size: 1.6rem;
            font-weight: 700;
            color: #1a3a1a;
            margin-bottom: 0.3rem;
        }

        header p {
            font-size: 0.9rem;
            color: #5a6e5a;
        }

        /* Upload area */
        .upload-area {
            background: #fff;
            border: 2px dashed #b8ccb8;
            border-radius: 12px;
            padding: 2.5rem 1.5rem;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
            position: relative;
        }

        .upload-area:hover,
        .upload-area.dragover {
            border-color: #4a8c4a;
            background: #f5faf5;
        }

        .upload-area input[type="file"] {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
        }

        .upload-icon {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        .upload-area h2 {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 0.3rem;
        }

        .upload-area p {
            font-size: 0.85rem;
            color: #7a8e7a;
        }

        /* File list */
        .file-list {
            margin-top: 1rem;
        }

        .file-chip {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            background: #e8f0e8;
            border-radius: 6px;
            padding: 0.35rem 0.7rem;
            font-size: 0.8rem;
            margin: 0.2rem;
            color: #2a4a2a;
        }

        .file-chip .remove {
            cursor: pointer;
            font-weight: 700;
            color: #8a3a3a;
            margin-left: 0.2rem;
        }

        .file-chip .remove:hover { color: #c44; }

        /* Button */
        .btn-row {
            margin-top: 1.5rem;
            text-align: center;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: #2a6e2a;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 0.75rem 2rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover { background: #1f5a1f; }

        .btn:disabled {
            background: #a0b8a0;
            cursor: not-allowed;
        }

        /* Progress */
        .progress-bar {
            display: none;
            margin-top: 1.5rem;
            background: #dde6dd;
            border-radius: 8px;
            overflow: hidden;
            height: 6px;
        }

        .progress-bar .fill {
            height: 100%;
            background: #2a6e2a;
            border-radius: 8px;
            transition: width 0.3s;
            width: 0%;
        }

        .status-text {
            display: none;
            text-align: center;
            margin-top: 0.6rem;
            font-size: 0.85rem;
            color: #5a6e5a;
        }

        /* Results */
        .results-section {
            display: none;
            margin-top: 2rem;
        }

        .total-card {
            background: #2a6e2a;
            color: #fff;
            border-radius: 12px;
            padding: 1.5rem;
            text-align: center;
            margin-bottom: 1.2rem;
        }

        .total-card .big-number {
            font-size: 3rem;
            font-weight: 800;
            line-height: 1;
            margin-bottom: 0.2rem;
        }

        .total-card .label {
            font-size: 0.9rem;
            opacity: 0.85;
        }

        .total-card .sub {
            font-size: 0.8rem;
            opacity: 0.65;
            margin-top: 0.3rem;
        }

        /* Per-image results table */
        .results-table {
            width: 100%;
            background: #fff;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
        }

        .results-table table {
            width: 100%;
            border-collapse: collapse;
        }

        .results-table th {
            background: #f5f8f5;
            text-align: left;
            padding: 0.7rem 1rem;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: #5a6e5a;
            font-weight: 600;
        }

        .results-table td {
            padding: 0.65rem 1rem;
            font-size: 0.85rem;
            border-top: 1px solid #eef2ee;
        }

        .results-table tr:hover td { background: #fafcfa; }

        .results-table .count-cell {
            font-weight: 700;
            font-size: 1rem;
            color: #2a6e2a;
        }

        .results-table .meta {
            font-size: 0.75rem;
            color: #8a9e8a;
        }

        .error-cell { color: #c44; font-size: 0.8rem; }

        /* Responsive */
        @media (max-width: 500px) {
            body { padding: 1rem; }
            .total-card .big-number { font-size: 2.4rem; }
            .results-table th, .results-table td { padding: 0.5rem 0.6rem; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🌸 Magnolia Plant Counter</h1>
        <p>Upload drone images &bull; YOLOv8 tiled inference &bull; NMS + dedup</p>
    </header>

    <!-- Upload -->
    <div class="upload-area" id="uploadArea">
        <input type="file" id="fileInput" accept="image/*" multiple>
        <div class="upload-icon">📁</div>
        <h2>Drop images here or click to browse</h2>
        <p>JPG, PNG, TIFF &mdash; multiple files supported</p>
    </div>

    <div class="file-list" id="fileList"></div>

    <div class="btn-row">
        <button class="btn" id="countBtn" disabled>
            <span id="btnIcon">🔬</span>
            <span id="btnText">Count Plants</span>
        </button>
    </div>

    <!-- Progress -->
    <div class="progress-bar" id="progressBar">
        <div class="fill" id="progressFill"></div>
    </div>
    <div class="status-text" id="statusText"></div>

    <!-- Results -->
    <div class="results-section" id="resultsSection">
        <div class="total-card">
            <div class="big-number" id="totalCount">0</div>
            <div class="label">Total Plants Detected</div>
            <div class="sub" id="totalSub"></div>
        </div>

        <div class="results-table">
            <table>
                <thead>
                    <tr>
                        <th>Image</th>
                        <th>Size</th>
                        <th>Tiles</th>
                        <th>Raw</th>
                        <th>Count</th>
                    </tr>
                </thead>
                <tbody id="resultsBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const fileInput  = document.getElementById("fileInput");
    const uploadArea = document.getElementById("uploadArea");
    const fileList   = document.getElementById("fileList");
    const countBtn   = document.getElementById("countBtn");
    const btnText    = document.getElementById("btnText");
    const btnIcon    = document.getElementById("btnIcon");
    const progressBar  = document.getElementById("progressBar");
    const progressFill = document.getElementById("progressFill");
    const statusText   = document.getElementById("statusText");
    const resultsSection = document.getElementById("resultsSection");
    const resultsBody    = document.getElementById("resultsBody");
    const totalCount     = document.getElementById("totalCount");
    const totalSub       = document.getElementById("totalSub");

    let selectedFiles = [];

    // Drag-and-drop highlight
    uploadArea.addEventListener("dragover", e => {
        e.preventDefault();
        uploadArea.classList.add("dragover");
    });
    uploadArea.addEventListener("dragleave", () => uploadArea.classList.remove("dragover"));
    uploadArea.addEventListener("drop", e => {
        e.preventDefault();
        uploadArea.classList.remove("dragover");
        addFiles(e.dataTransfer.files);
    });

    fileInput.addEventListener("change", () => addFiles(fileInput.files));

    function addFiles(files) {
        for (const f of files) {
            if (!selectedFiles.some(s => s.name === f.name && s.size === f.size)) {
                selectedFiles.push(f);
            }
        }
        renderFileList();
        countBtn.disabled = selectedFiles.length === 0;
        // Reset file input so the same file can be re-added after removal
        fileInput.value = "";
    }

    function renderFileList() {
        fileList.innerHTML = selectedFiles.map((f, i) =>
            `<span class="file-chip">
                ${f.name}
                <span class="remove" onclick="removeFile(${i})">&times;</span>
            </span>`
        ).join("");
    }

    function removeFile(i) {
        selectedFiles.splice(i, 1);
        renderFileList();
        countBtn.disabled = selectedFiles.length === 0;
    }

    // Count plants
    countBtn.addEventListener("click", async () => {
        if (selectedFiles.length === 0) return;

        countBtn.disabled = true;
        btnText.textContent = "Processing...";
        btnIcon.textContent = "⏳";
        progressBar.style.display = "block";
        progressFill.style.width = "15%";
        statusText.style.display = "block";
        statusText.textContent = `Uploading ${selectedFiles.length} image(s)...`;
        resultsSection.style.display = "none";

        const formData = new FormData();
        for (const f of selectedFiles) {
            formData.append("images", f);
        }

        try {
            progressFill.style.width = "40%";
            statusText.textContent = "Running tiled inference (this may take a minute)...";

            const resp = await fetch("/count", { method: "POST", body: formData });

            progressFill.style.width = "90%";

            if (!resp.ok) {
                const err = await resp.json();
                throw new Error(err.error || "Server error");
            }

            const data = await resp.json();

            progressFill.style.width = "100%";
            statusText.textContent = "Done!";

            // Show results
            totalCount.textContent = data.total_plants.toLocaleString();
            totalSub.textContent = `across ${data.total_images} image(s)`;

            resultsBody.innerHTML = data.results.map(r => {
                if (r.error) {
                    return `<tr>
                        <td>${r.filename}</td>
                        <td colspan="3" class="error-cell">${r.error}</td>
                        <td>—</td>
                    </tr>`;
                }
                return `<tr>
                    <td>${r.filename}</td>
                    <td class="meta">${r.image_size}</td>
                    <td class="meta">${r.tiles_processed}</td>
                    <td class="meta">${r.raw_detections.toLocaleString()}</td>
                    <td class="count-cell">${r.plant_count.toLocaleString()}</td>
                </tr>`;
            }).join("");

            resultsSection.style.display = "block";

        } catch (err) {
            statusText.textContent = "Error: " + err.message;
        }

        btnText.textContent = "Count Plants";
        btnIcon.textContent = "🔬";
        countBtn.disabled = false;

        setTimeout(() => {
            progressBar.style.display = "none";
            progressFill.style.width = "0%";
        }, 1500);
    });
</script>

</body>
</html>
