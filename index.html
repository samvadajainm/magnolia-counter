<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magnolia Plant Counter</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/onnxruntime-web/1.17.3/ort.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f0f4f3;
            color: #1a2e1a;
            min-height: 100vh;
            padding: 2rem 1rem;
        }

        .container { max-width: 760px; margin: 0 auto; }

        header { text-align: center; margin-bottom: 2rem; }
        header h1 { font-size: 1.6rem; font-weight: 700; color: #1a3a1a; margin-bottom: 0.3rem; }
        header p { font-size: 0.9rem; color: #5a6e5a; }

        .upload-area {
            background: #fff;
            border: 2px dashed #b8ccb8;
            border-radius: 12px;
            padding: 2.5rem 1.5rem;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
            position: relative;
        }
        .upload-area:hover, .upload-area.dragover {
            border-color: #4a8c4a; background: #f5faf5;
        }
        .upload-area input[type="file"] {
            position: absolute; inset: 0; opacity: 0; cursor: pointer;
        }
        .upload-icon { font-size: 2.5rem; margin-bottom: 0.5rem; }
        .upload-area h2 { font-size: 1rem; font-weight: 600; margin-bottom: 0.3rem; }
        .upload-area p { font-size: 0.85rem; color: #7a8e7a; }

        .file-list { margin-top: 1rem; }
        .file-chip {
            display: inline-flex; align-items: center; gap: 0.4rem;
            background: #e8f0e8; border-radius: 6px;
            padding: 0.35rem 0.7rem; font-size: 0.8rem;
            margin: 0.2rem; color: #2a4a2a;
        }
        .file-chip .remove {
            cursor: pointer; font-weight: 700; color: #8a3a3a; margin-left: 0.2rem;
        }
        .file-chip .remove:hover { color: #c44; }

        .btn-row { margin-top: 1.5rem; text-align: center; }
        .btn {
            display: inline-flex; align-items: center; gap: 0.5rem;
            background: #2a6e2a; color: #fff; border: none;
            border-radius: 8px; padding: 0.75rem 2rem;
            font-size: 1rem; font-weight: 600; cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover { background: #1f5a1f; }
        .btn:disabled { background: #a0b8a0; cursor: not-allowed; }

        .progress-section { display: none; margin-top: 1.5rem; }
        .progress-bar {
            background: #dde6dd; border-radius: 8px;
            overflow: hidden; height: 6px;
        }
        .progress-bar .fill {
            height: 100%; background: #2a6e2a;
            border-radius: 8px; transition: width 0.3s; width: 0%;
        }
        .status-text {
            text-align: center; margin-top: 0.6rem;
            font-size: 0.85rem; color: #5a6e5a;
        }

        .model-status {
            text-align: center; margin-bottom: 1rem;
            font-size: 0.8rem; color: #5a6e5a;
            padding: 0.5rem; background: #fff; border-radius: 8px;
        }
        .model-status.loading { color: #8a6e2a; background: #fdf8ee; }
        .model-status.ready { color: #2a6e2a; background: #eef8ee; }
        .model-status.error { color: #8a2a2a; background: #f8eeee; }

        .results-section { display: none; margin-top: 2rem; }
        .total-card {
            background: #2a6e2a; color: #fff;
            border-radius: 12px; padding: 1.5rem; text-align: center;
            margin-bottom: 1.2rem;
        }
        .total-card .big-number {
            font-size: 3rem; font-weight: 800; line-height: 1; margin-bottom: 0.2rem;
        }
        .total-card .label { font-size: 0.9rem; opacity: 0.85; }
        .total-card .sub { font-size: 0.8rem; opacity: 0.65; margin-top: 0.3rem; }
        .total-card .mode-badge {
            display: inline-block; margin-top: 0.4rem;
            font-size: 0.7rem; background: rgba(255,255,255,0.2);
            padding: 0.15rem 0.6rem; border-radius: 10px;
        }

        .results-table {
            width: 100%; background: #fff; border-radius: 10px;
            overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.06);
        }
        .results-table table { width: 100%; border-collapse: collapse; }
        .results-table th {
            background: #f5f8f5; text-align: left;
            padding: 0.7rem 0.6rem; font-size: 0.7rem;
            text-transform: uppercase; letter-spacing: 0.04em;
            color: #5a6e5a; font-weight: 600;
        }
        .results-table td {
            padding: 0.6rem; font-size: 0.82rem;
            border-top: 1px solid #eef2ee;
        }
        .results-table tr:hover td { background: #fafcfa; }
        .results-table .count-cell {
            font-weight: 700; font-size: 1rem; color: #2a6e2a;
        }
        .results-table .meta { font-size: 0.75rem; color: #8a9e8a; }
        .results-table .winner { background: #eef8ee; }
        .results-table .skipped { color: #bbb; font-style: italic; }

        .annotated-images { margin-top: 1.5rem; }
        .annotated-card {
            background: #fff; border-radius: 10px;
            overflow: hidden; margin-bottom: 1.2rem;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
        }
        .annotated-card .card-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 0.7rem 1rem; background: #f5f8f5;
            border-bottom: 1px solid #eef2ee;
            flex-wrap: wrap; gap: 0.3rem;
        }
        .annotated-card .card-header h3 {
            font-size: 0.85rem; font-weight: 600; color: #2a4a2a;
        }
        .annotated-card .card-header .badge {
            background: #2a6e2a; color: #fff; font-size: 0.75rem;
            font-weight: 700; padding: 0.2rem 0.6rem; border-radius: 10px;
        }
        .annotated-card .card-header .tile-badge {
            background: #3a5e8a; color: #fff; font-size: 0.68rem;
            font-weight: 600; padding: 0.15rem 0.5rem; border-radius: 10px;
        }
        .annotated-card .card-body { padding: 0.5rem; }
        .annotated-card canvas {
            width: 100%; height: auto; display: block; border-radius: 6px;
        }
        .download-btn {
            display: inline-block; margin: 0.5rem; padding: 0.4rem 0.8rem;
            font-size: 0.75rem; background: #e8f0e8; color: #2a4a2a;
            border: none; border-radius: 6px; cursor: pointer;
            text-decoration: none; font-weight: 600;
        }
        .download-btn:hover { background: #d0e0d0; }

        .pipeline-info {
            margin-top: 1rem; padding: 0.8rem 1rem;
            background: #fff; border-radius: 10px;
            font-size: 0.78rem; color: #5a6e5a;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
            line-height: 1.5;
        }
        .pipeline-info strong { color: #2a4a2a; }

        @media (max-width: 500px) {
            body { padding: 1rem; }
            .total-card .big-number { font-size: 2.4rem; }
            .results-table th, .results-table td { padding: 0.4rem 0.3rem; }
            .results-table th { font-size: 0.62rem; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Magnolia Plant Counter</h1>
        <p>Upload drone images &bull; YOLOv8n + ONNX Runtime &bull; Adaptive multi-scale tiled inference</p>
    </header>

    <div class="model-status loading" id="modelStatus">Loading model (~12 MB)...</div>

    <div class="upload-area" id="uploadArea">
        <input type="file" id="fileInput" accept="image/*" multiple>
        <div class="upload-icon">📁</div>
        <h2>Drop images here or click to browse</h2>
        <p>JPG, PNG, TIFF - multiple files supported</p>
    </div>

    <div class="file-list" id="fileList"></div>

    <div class="btn-row">
        <button class="btn" id="countBtn" disabled>
            <span id="btnIcon">🔬</span>
            <span id="btnText">Count Plants</span>
        </button>
    </div>

    <div class="progress-section" id="progressSection">
        <div class="progress-bar"><div class="fill" id="progressFill"></div></div>
        <div class="status-text" id="statusText"></div>
    </div>

    <div class="results-section" id="resultsSection">
        <div class="total-card">
            <div class="big-number" id="totalCount">0</div>
            <div class="label">Total Plants Detected</div>
            <div class="sub" id="totalSub"></div>
            <div class="mode-badge" id="modeBadge"></div>
        </div>
        <div class="results-table">
            <table>
                <thead>
                    <tr>
                        <th>Image</th>
                        <th>Resolution</th>
                        <th>Letterbox</th>
                        <th>Tiled</th>
                        <th>Best</th>
                        <th>Scale</th>
                    </tr>
                </thead>
                <tbody id="resultsBody"></tbody>
            </table>
        </div>

        <div class="pipeline-info" id="pipelineInfo"></div>
        <div class="annotated-images" id="annotatedImages"></div>
    </div>
</div>

<script>
// ── Config ─────────────────────────────────────────────────
const MODEL_URL  = "best.onnx";
const INPUT_SIZE = 640;

// Tile configs by image size — chosen automatically
const TILE_LARGE = { tileSize: 1024, overlap: 205, label: "1024" };   // for images > 1500px shortest side
const TILE_MED   = { tileSize: 512,  overlap: 102, label: "512"  };   // for images 800-1500px
const TILE_SMALL = { tileSize: 320,  overlap: 64,  label: "320"  };   // for images < 800px

function pickTileConfig(imgW, imgH) {
    const shortSide = Math.min(imgW, imgH);
    if (shortSide >= 1500) return TILE_LARGE;
    if (shortSide >= 800)  return TILE_MED;
    return TILE_SMALL;
}

// Match Harshitha's proven settings
const CONF            = 0.20;
const NMS_IOU         = 0.45;
const MIN_CENTER_DIST = 250;

let session = null;

// ── DOM refs ───────────────────────────────────────────────
const fileInput       = document.getElementById("fileInput");
const uploadArea      = document.getElementById("uploadArea");
const fileList        = document.getElementById("fileList");
const countBtn        = document.getElementById("countBtn");
const btnText         = document.getElementById("btnText");
const btnIcon         = document.getElementById("btnIcon");
const progressSection = document.getElementById("progressSection");
const progressFill    = document.getElementById("progressFill");
const statusText      = document.getElementById("statusText");
const resultsSection  = document.getElementById("resultsSection");
const resultsBody     = document.getElementById("resultsBody");
const totalCount      = document.getElementById("totalCount");
const totalSub        = document.getElementById("totalSub");
const modelStatus     = document.getElementById("modelStatus");
const modeBadge       = document.getElementById("modeBadge");
const pipelineInfo    = document.getElementById("pipelineInfo");

let selectedFiles = [];

// ── Load ONNX model ────────────────────────────────────────
async function loadModel() {
    try {
        ort.env.wasm.wasmPaths = "https://cdnjs.cloudflare.com/ajax/libs/onnxruntime-web/1.17.3/";
        ort.env.wasm.numThreads = 1;
        session = await ort.InferenceSession.create(MODEL_URL, {
            executionProviders: ["wasm"],
            graphOptimizationLevel: "all",
        });
        modelStatus.textContent = "Model loaded - ready to count plants";
        modelStatus.className = "model-status ready";
        updateButtonState();
    } catch (e) {
        modelStatus.textContent = "Failed to load model: " + e.message;
        modelStatus.className = "model-status error";
    }
}
loadModel();

// ── File handling ──────────────────────────────────────────
uploadArea.addEventListener("dragover", e => { e.preventDefault(); uploadArea.classList.add("dragover"); });
uploadArea.addEventListener("dragleave", () => uploadArea.classList.remove("dragover"));
uploadArea.addEventListener("drop", e => { e.preventDefault(); uploadArea.classList.remove("dragover"); addFiles(e.dataTransfer.files); });
fileInput.addEventListener("change", () => { addFiles(fileInput.files); fileInput.value = ""; });

function addFiles(files) {
    for (const f of files) {
        if (!selectedFiles.some(s => s.name === f.name && s.size === f.size))
            selectedFiles.push(f);
    }
    renderFileList();
    updateButtonState();
}
function renderFileList() {
    fileList.innerHTML = selectedFiles.map((f, i) =>
        `<span class="file-chip">${f.name}<span class="remove" onclick="removeFile(${i})">&times;</span></span>`
    ).join("");
}
function removeFile(i) {
    selectedFiles.splice(i, 1);
    renderFileList();
    updateButtonState();
}
function updateButtonState() {
    countBtn.disabled = selectedFiles.length === 0 || !session;
}

function loadImageFromFile(file) {
    return new Promise(resolve => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.src = URL.createObjectURL(file);
    });
}

// ── Yield to browser ───────────────────────────────────────
// Prevents "page unresponsive" by giving the event loop a turn
function yieldToUI() {
    return new Promise(resolve => setTimeout(resolve, 0));
}

// ── Tiling ─────────────────────────────────────────────────
function tileImage(canvas, tileSize, overlap) {
    const w = canvas.width, h = canvas.height;
    const stride = tileSize - overlap;
    const tiles = [];
    for (let row = 0; row < h; row += stride) {
        for (let col = 0; col < w; col += stride) {
            const rEnd = Math.min(row + tileSize, h);
            const cEnd = Math.min(col + tileSize, w);
            const tc = document.createElement("canvas");
            tc.width = tileSize; tc.height = tileSize;
            const tCtx = tc.getContext("2d");
            tCtx.fillStyle = "rgb(114,114,114)";
            tCtx.fillRect(0, 0, tileSize, tileSize);
            tCtx.drawImage(canvas, col, row, cEnd - col, rEnd - row, 0, 0, cEnd - col, rEnd - row);
            tiles.push({ canvas: tc, row, col });
        }
    }
    return tiles;
}

function countTiles(imgW, imgH, tileSize, overlap) {
    const stride = tileSize - overlap;
    return Math.ceil(imgW / stride) * Math.ceil(imgH / stride);
}

// ── Preprocessing ──────────────────────────────────────────
function preprocessTile(tileCanvas) {
    const c = document.createElement("canvas");
    c.width = INPUT_SIZE; c.height = INPUT_SIZE;
    const ctx = c.getContext("2d", { willReadFrequently: true });
    ctx.fillStyle = "rgb(114,114,114)";
    ctx.fillRect(0, 0, INPUT_SIZE, INPUT_SIZE);
    ctx.drawImage(tileCanvas, 0, 0, INPUT_SIZE, INPUT_SIZE);
    const px = ctx.getImageData(0, 0, INPUT_SIZE, INPUT_SIZE).data;
    const f = new Float32Array(3 * INPUT_SIZE * INPUT_SIZE);
    const n = INPUT_SIZE * INPUT_SIZE;
    for (let i = 0; i < n; i++) {
        f[i]         = px[i * 4]     / 255;
        f[i + n]     = px[i * 4 + 1] / 255;
        f[i + 2 * n] = px[i * 4 + 2] / 255;
    }
    return new ort.Tensor("float32", f, [1, 3, INPUT_SIZE, INPUT_SIZE]);
}

// ── Parse output ───────────────────────────────────────────
function parseOutput(output, tileRow, tileCol, tileSize) {
    const data = output.data;
    const nd = output.dims[2];
    const boxes = [];
    const scale = tileSize / INPUT_SIZE;
    for (let i = 0; i < nd; i++) {
        const conf = data[4 * nd + i];
        if (conf < CONF) continue;
        const cx = data[0 * nd + i] * scale + tileCol;
        const cy = data[1 * nd + i] * scale + tileRow;
        const w  = data[2 * nd + i] * scale;
        const h  = data[3 * nd + i] * scale;
        boxes.push([cx, cy, w, h, conf]);
    }
    return boxes;
}

// ── NMS ────────────────────────────────────────────────────
function computeIoU(b1, b2) {
    const ax1 = b1[0] - b1[2] / 2, ay1 = b1[1] - b1[3] / 2;
    const ax2 = b1[0] + b1[2] / 2, ay2 = b1[1] + b1[3] / 2;
    const bx1 = b2[0] - b2[2] / 2, by1 = b2[1] - b2[3] / 2;
    const bx2 = b2[0] + b2[2] / 2, by2 = b2[1] + b2[3] / 2;
    const inter = Math.max(0, Math.min(ax2, bx2) - Math.max(ax1, bx1)) *
                  Math.max(0, Math.min(ay2, by2) - Math.max(ay1, by1));
    const union = b1[2] * b1[3] + b2[2] * b2[3] - inter;
    return union > 0 ? inter / union : 0;
}

function nmsBoxes(boxes) {
    if (!boxes.length) return [];
    boxes.sort((a, b) => b[4] - a[4]);
    const keep = [];
    while (boxes.length) {
        const best = boxes.shift();
        keep.push(best);
        boxes = boxes.filter(b => computeIoU(best, b) < NMS_IOU);
    }
    return keep;
}

function centerDedup(boxes) {
    if (!boxes.length) return [];
    boxes.sort((a, b) => b[4] - a[4]);
    const keep = [];
    for (const box of boxes) {
        let tooClose = false;
        for (const k of keep) {
            if (Math.hypot(box[0] - k[0], box[1] - k[1]) < MIN_CENTER_DIST) {
                tooClose = true; break;
            }
        }
        if (!tooClose) keep.push(box);
    }
    return keep;
}

// ── Letterbox pass (Harshitha's approach) ──────────────────
// Single 640×640 pass with aspect-ratio-preserving resize + gray padding.
// Fast (1 inference) and works well when plants are clearly visible.
async function runLetterbox(sourceCanvas) {
    const imgW = sourceCanvas.width, imgH = sourceCanvas.height;
    const scale = Math.min(INPUT_SIZE / imgW, INPUT_SIZE / imgH);
    const newW = Math.round(imgW * scale);
    const newH = Math.round(imgH * scale);
    const padX = Math.round((INPUT_SIZE - newW) / 2);
    const padY = Math.round((INPUT_SIZE - newH) / 2);

    // Create letterboxed canvas
    const lbCanvas = document.createElement("canvas");
    lbCanvas.width = INPUT_SIZE; lbCanvas.height = INPUT_SIZE;
    const lbCtx = lbCanvas.getContext("2d");
    lbCtx.fillStyle = "rgb(114,114,114)";
    lbCtx.fillRect(0, 0, INPUT_SIZE, INPUT_SIZE);
    lbCtx.drawImage(sourceCanvas, 0, 0, imgW, imgH, padX, padY, newW, newH);

    // Preprocess directly (already 640×640)
    const px = lbCtx.getImageData(0, 0, INPUT_SIZE, INPUT_SIZE).data;
    const f = new Float32Array(3 * INPUT_SIZE * INPUT_SIZE);
    const n = INPUT_SIZE * INPUT_SIZE;
    for (let i = 0; i < n; i++) {
        f[i]         = px[i * 4]     / 255;
        f[i + n]     = px[i * 4 + 1] / 255;
        f[i + 2 * n] = px[i * 4 + 2] / 255;
    }
    const tensor = new ort.Tensor("float32", f, [1, 3, INPUT_SIZE, INPUT_SIZE]);
    const results = await session.run({ [session.inputNames[0]]: tensor });
    const output = results[session.outputNames[0]];

    // Parse output and map boxes back to original image coords
    const data = output.data;
    const nd = output.dims[2];
    const boxes = [];
    for (let i = 0; i < nd; i++) {
        const conf = data[4 * nd + i];
        if (conf < CONF) continue;
        // Model outputs are in 640×640 letterbox space; map back to original
        const cx = (data[0 * nd + i] - padX) / scale;
        const cy = (data[1 * nd + i] - padY) / scale;
        const w  = data[2 * nd + i] / scale;
        const h  = data[3 * nd + i] / scale;
        // Skip boxes that fall in the padding
        if (cx < 0 || cy < 0 || cx > imgW || cy > imgH) continue;
        boxes.push([cx, cy, w, h, conf]);
    }

    const afterNms = nmsBoxes(boxes);
    await yieldToUI();

    return {
        tileSize: 0,
        label: "LB",
        tilesProcessed: 1,
        rawDetections: boxes.length,
        afterNms: afterNms.length,
        plantCount: afterNms.length,
        boxes: afterNms,
    };
}

// ── Run one tile config ────────────────────────────────────
async function runScale(sourceCanvas, cfg, onTileProgress) {
    const tiles = tileImage(sourceCanvas, cfg.tileSize, cfg.overlap);
    let allBoxes = [];

    for (let t = 0; t < tiles.length; t++) {
        const { canvas: tc, row, col } = tiles[t];
        const tensor = preprocessTile(tc);
        const results = await session.run({ [session.inputNames[0]]: tensor });
        const output = results[session.outputNames[0]];
        allBoxes = allBoxes.concat(parseOutput(output, row, col, cfg.tileSize));

        if (onTileProgress) onTileProgress(t + 1, tiles.length);

        // Yield to the browser every tile so it doesn't freeze
        await yieldToUI();
    }

    const raw = allBoxes.length;
    const afterNms = nmsBoxes(allBoxes);
    const afterDedup = centerDedup(afterNms);

    return {
        tileSize: cfg.tileSize,
        label: cfg.label,
        tilesProcessed: tiles.length,
        rawDetections: raw,
        afterNms: afterNms.length,
        plantCount: afterDedup.length,
        boxes: afterDedup,
    };
}

// ── Process one image: adaptive multi-scale ────────────────
async function processImage(file, imageIdx, totalImages, updateOverallProgress) {
    const img = await loadImageFromFile(file);
    const canvas = document.createElement("canvas");
    canvas.width = img.naturalWidth;
    canvas.height = img.naturalHeight;
    canvas.getContext("2d").drawImage(img, 0, 0);
    URL.revokeObjectURL(img.src);

    const imgW = canvas.width, imgH = canvas.height;

    const scaleResults = [];

    // ── Letterbox pass (fast, single inference) ──
    updateOverallProgress(
        `Image ${imageIdx + 1}/${totalImages}: ${file.name} — letterbox pass...`,
        imageIdx / totalImages
    );
    const lbResult = await runLetterbox(canvas);
    scaleResults.push(lbResult);

    // ── Tiled pass: tile size chosen by image resolution ──
    const tileCfg = pickTileConfig(imgW, imgH);
    const totalTiles = countTiles(imgW, imgH, tileCfg.tileSize, tileCfg.overlap);

    updateOverallProgress(
        `Image ${imageIdx + 1}/${totalImages}: ${file.name} — ${tileCfg.label} tiles (${imgW}×${imgH} → ${tileCfg.label}px tiles)...`,
        (imageIdx + 0.05) / totalImages
    );

    const tileResult = await runScale(canvas, tileCfg, (done, total) => {
        updateOverallProgress(
            `Image ${imageIdx + 1}/${totalImages}: ${file.name} — ${tileCfg.label} tiles (${done}/${total})`,
            (imageIdx + 0.05 + 0.9 * done / total) / totalImages
        );
    });
    scaleResults.push(tileResult);

    // Pick best: highest count
    let bestIdx = 0;
    for (let i = 1; i < scaleResults.length; i++) {
        if (scaleResults[i].plantCount > scaleResults[bestIdx].plantCount) {
            bestIdx = i;
        }
    }
    const best = scaleResults[bestIdx];

    return {
        filename: file.name,
        imgW: imgW,
        imgH: imgH,
        scaleResults,
        bestIdx,
        plantCount: best.plantCount,
        boxes: best.boxes,
        selectedTile: best.label,
        sourceCanvas: canvas,
    };
}

// ── Draw annotated image ──────────────────────────────────
function drawAnnotatedImage(sourceCanvas, boxes) {
    const ac = document.createElement("canvas");
    ac.width = sourceCanvas.width;
    ac.height = sourceCanvas.height;
    const ctx = ac.getContext("2d");
    ctx.drawImage(sourceCanvas, 0, 0);

    const shortSide = Math.min(ac.width, ac.height);
    const lw = Math.max(2, Math.round(shortSide / 500));
    const fs = Math.max(12, Math.round(shortSide / 300));

    ctx.strokeStyle = "#00FF00";
    ctx.lineWidth = lw;
    ctx.font = `bold ${fs}px sans-serif`;

    for (const [cx, cy, w, h, conf] of boxes) {
        const x1 = cx - w / 2, y1 = cy - h / 2;
        ctx.strokeRect(x1, y1, w, h);
        const label = `${(conf * 100).toFixed(0)}%`;
        const tw = ctx.measureText(label).width;
        const lh = fs + 4;
        ctx.fillStyle = "rgba(0, 180, 0, 0.7)";
        ctx.fillRect(x1, y1 - lh, tw + 6, lh);
        ctx.fillStyle = "#fff";
        ctx.fillText(label, x1 + 3, y1 - 4);
    }

    const countLabel = `${boxes.length} plants detected`;
    const wmFs = Math.max(16, Math.round(shortSide / 150));
    ctx.font = `bold ${wmFs}px sans-serif`;
    const pad = Math.round(wmFs * 0.6);
    const wmTw = ctx.measureText(countLabel).width;
    ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
    ctx.fillRect(pad, pad, wmTw + pad * 2, wmFs + pad);
    ctx.fillStyle = "#00FF00";
    ctx.fillText(countLabel, pad * 2, pad + wmFs - 2);

    return ac;
}

// ── Count button handler ───────────────────────────────────
countBtn.addEventListener("click", async () => {
    if (selectedFiles.length === 0 || !session) return;

    countBtn.disabled = true;
    btnText.textContent = "Processing...";
    btnIcon.textContent = "⏳";
    progressSection.style.display = "block";
    resultsSection.style.display = "none";

    const results = [];
    let totalPlants = 0;

    for (let f = 0; f < selectedFiles.length; f++) {
        try {
            const result = await processImage(selectedFiles[f], f, selectedFiles.length,
                (msg, progress) => {
                    statusText.textContent = msg;
                    progressFill.style.width = (progress * 100).toFixed(1) + "%";
                }
            );
            results.push(result);
            totalPlants += result.plantCount;
        } catch (err) {
            results.push({ filename: selectedFiles[f].name, error: err.message, plantCount: 0 });
        }
    }

    // Display
    progressFill.style.width = "100%";
    statusText.textContent = "Done! Drawing annotations...";
    await yieldToUI();

    totalCount.textContent = totalPlants.toLocaleString();
    totalSub.textContent = `across ${results.length} image(s)`;
    modeBadge.textContent = "Adaptive multi-scale tiled inference";

    // Build table rows
    resultsBody.innerHTML = results.map(r => {
        if (r.error) {
            return `<tr><td>${r.filename}</td><td colspan="5" style="color:#c44;font-size:0.8rem">${r.error}</td><td>—</td></tr>`;
        }
        // Map scale results by label
        const byLabel = {};
        r.scaleResults.forEach(s => { byLabel[s.label] = s; });

        const cell = (label) => {
            const s = byLabel[label];
            if (!s) return `<td class="meta skipped">—</td>`;
            const isWinner = r.selectedTile === label;
            const tInfo = s.tilesProcessed === 1 ? "1" : `${s.tilesProcessed}t`;
            return `<td class="meta ${isWinner ? 'winner' : ''}">${s.plantCount} <span style="font-size:0.6rem;color:#aaa">(${tInfo})</span></td>`;
        };

        // Find the tiled result (non-LB)
        const tiledResult = r.scaleResults.find(s => s.label !== "LB");
        const tiledLabel = tiledResult ? tiledResult.label : "—";

        return `<tr>
            <td>${r.filename}</td>
            <td class="meta">${r.imgW}×${r.imgH}</td>
            ${cell("LB")}
            ${cell(tiledLabel)}
            <td class="count-cell">${r.plantCount.toLocaleString()}</td>
            <td class="meta">${r.selectedTile}</td>
        </tr>`;
    }).join("");

    // Pipeline info
    const details = results.filter(r => !r.error).map(r => {
        const counts = r.scaleResults.map(s => `${s.label}=${s.plantCount}`).join(", ");
        const finerNote = r.triedFiner ? " (tried finer scales due to low initial count)" : "";
        return `<strong>${r.filename}</strong>: selected ${r.selectedTile} (${counts})${finerNote}`;
    }).join("<br>");


    // Annotated images
    const container = document.getElementById("annotatedImages");
    container.innerHTML = "";

    for (const r of results) {
        if (r.error || !r.sourceCanvas) continue;
        const ac = drawAnnotatedImage(r.sourceCanvas, r.boxes);
        const card = document.createElement("div");
        card.className = "annotated-card";
        const hdr = document.createElement("div");
        hdr.className = "card-header";
        hdr.innerHTML = `<h3>${r.filename}</h3><span class="badge">${r.plantCount} plants</span><span class="tile-badge">tile ${r.selectedTile}</span>`;
        const body = document.createElement("div");
        body.className = "card-body";
        body.appendChild(ac);
        const dl = document.createElement("a");
        dl.className = "download-btn";
        dl.textContent = "⬇ Download annotated image";
        dl.download = r.filename.replace(/\.[^.]+$/, "") + "_annotated.jpg";
        dl.href = ac.toDataURL("image/jpeg", 0.92);
        body.appendChild(dl);
        card.appendChild(hdr);
        card.appendChild(body);
        container.appendChild(card);
    }

    statusText.textContent = "Done!";
    resultsSection.style.display = "block";
    btnText.textContent = "Count Plants";
    btnIcon.textContent = "🔬";
    countBtn.disabled = false;

    setTimeout(() => {
        progressSection.style.display = "none";
        progressFill.style.width = "0%";
    }, 2000);
});
</script>
