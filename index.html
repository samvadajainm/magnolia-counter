<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magnolia Plant Counter</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/onnxruntime-web/1.17.3/ort.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f0f4f3;
            color: #1a2e1a;
            min-height: 100vh;
            padding: 2rem 1rem;
        }

        .container { max-width: 760px; margin: 0 auto; }

        header { text-align: center; margin-bottom: 2rem; }
        header h1 { font-size: 1.6rem; font-weight: 700; color: #1a3a1a; margin-bottom: 0.3rem; }
        header p { font-size: 0.9rem; color: #5a6e5a; }

        /* Upload area */
        .upload-area {
            background: #fff;
            border: 2px dashed #b8ccb8;
            border-radius: 12px;
            padding: 2.5rem 1.5rem;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
            position: relative;
        }
        .upload-area:hover, .upload-area.dragover {
            border-color: #4a8c4a;
            background: #f5faf5;
        }
        .upload-area input[type="file"] {
            position: absolute; inset: 0; opacity: 0; cursor: pointer;
        }
        .upload-icon { font-size: 2.5rem; margin-bottom: 0.5rem; }
        .upload-area h2 { font-size: 1rem; font-weight: 600; margin-bottom: 0.3rem; }
        .upload-area p { font-size: 0.85rem; color: #7a8e7a; }

        /* File list */
        .file-list { margin-top: 1rem; }
        .file-chip {
            display: inline-flex; align-items: center; gap: 0.4rem;
            background: #e8f0e8; border-radius: 6px;
            padding: 0.35rem 0.7rem; font-size: 0.8rem;
            margin: 0.2rem; color: #2a4a2a;
        }
        .file-chip .remove {
            cursor: pointer; font-weight: 700; color: #8a3a3a; margin-left: 0.2rem;
        }
        .file-chip .remove:hover { color: #c44; }

        /* Button */
        .btn-row { margin-top: 1.5rem; text-align: center; }
        .btn {
            display: inline-flex; align-items: center; gap: 0.5rem;
            background: #2a6e2a; color: #fff; border: none;
            border-radius: 8px; padding: 0.75rem 2rem;
            font-size: 1rem; font-weight: 600; cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover { background: #1f5a1f; }
        .btn:disabled { background: #a0b8a0; cursor: not-allowed; }

        /* Progress */
        .progress-section { display: none; margin-top: 1.5rem; }
        .progress-bar {
            background: #dde6dd; border-radius: 8px;
            overflow: hidden; height: 6px;
        }
        .progress-bar .fill {
            height: 100%; background: #2a6e2a;
            border-radius: 8px; transition: width 0.3s; width: 0%;
        }
        .status-text {
            text-align: center; margin-top: 0.6rem;
            font-size: 0.85rem; color: #5a6e5a;
        }

        /* Model loading */
        .model-status {
            text-align: center; margin-bottom: 1rem;
            font-size: 0.8rem; color: #5a6e5a;
            padding: 0.5rem; background: #fff; border-radius: 8px;
        }
        .model-status.loading { color: #8a6e2a; background: #fdf8ee; }
        .model-status.ready { color: #2a6e2a; background: #eef8ee; }
        .model-status.error { color: #8a2a2a; background: #f8eeee; }

        /* Results */
        .results-section { display: none; margin-top: 2rem; }
        .total-card {
            background: #2a6e2a; color: #fff;
            border-radius: 12px; padding: 1.5rem; text-align: center;
            margin-bottom: 1.2rem;
        }
        .total-card .big-number {
            font-size: 3rem; font-weight: 800; line-height: 1; margin-bottom: 0.2rem;
        }
        .total-card .label { font-size: 0.9rem; opacity: 0.85; }
        .total-card .sub { font-size: 0.8rem; opacity: 0.65; margin-top: 0.3rem; }
        .total-card .mode-badge {
            display: inline-block; margin-top: 0.4rem;
            font-size: 0.7rem; background: rgba(255,255,255,0.2);
            padding: 0.15rem 0.6rem; border-radius: 10px;
        }

        .results-table {
            width: 100%; background: #fff; border-radius: 10px;
            overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.06);
        }
        .results-table table { width: 100%; border-collapse: collapse; }
        .results-table th {
            background: #f5f8f5; text-align: left;
            padding: 0.7rem 0.8rem; font-size: 0.72rem;
            text-transform: uppercase; letter-spacing: 0.04em;
            color: #5a6e5a; font-weight: 600;
        }
        .results-table td {
            padding: 0.65rem 0.8rem; font-size: 0.85rem;
            border-top: 1px solid #eef2ee;
        }
        .results-table tr:hover td { background: #fafcfa; }
        .results-table .count-cell {
            font-weight: 700; font-size: 1rem; color: #2a6e2a;
        }
        .results-table .meta { font-size: 0.75rem; color: #8a9e8a; }
        .results-table .winner { background: #eef8ee; }

        /* Annotated images */
        .annotated-images { margin-top: 1.5rem; }
        .annotated-card {
            background: #fff; border-radius: 10px;
            overflow: hidden; margin-bottom: 1.2rem;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
        }
        .annotated-card .card-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 0.7rem 1rem; background: #f5f8f5;
            border-bottom: 1px solid #eef2ee;
        }
        .annotated-card .card-header h3 {
            font-size: 0.85rem; font-weight: 600; color: #2a4a2a;
        }
        .annotated-card .card-header .badge {
            background: #2a6e2a; color: #fff; font-size: 0.75rem;
            font-weight: 700; padding: 0.2rem 0.6rem; border-radius: 10px;
        }
        .annotated-card .card-header .tile-badge {
            background: #3a5e8a; color: #fff; font-size: 0.68rem;
            font-weight: 600; padding: 0.15rem 0.5rem; border-radius: 10px;
            margin-left: 0.4rem;
        }
        .annotated-card .card-body {
            padding: 0.5rem; position: relative;
        }
        .annotated-card canvas {
            width: 100%; height: auto; display: block; border-radius: 6px;
        }
        .download-btn {
            display: inline-block; margin: 0.5rem; padding: 0.4rem 0.8rem;
            font-size: 0.75rem; background: #e8f0e8; color: #2a4a2a;
            border: none; border-radius: 6px; cursor: pointer;
            text-decoration: none; font-weight: 600;
        }
        .download-btn:hover { background: #d0e0d0; }

        .pipeline-info {
            margin-top: 1rem; padding: 0.8rem 1rem;
            background: #fff; border-radius: 10px;
            font-size: 0.78rem; color: #5a6e5a;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
            line-height: 1.5;
        }
        .pipeline-info strong { color: #2a4a2a; }

        @media (max-width: 500px) {
            body { padding: 1rem; }
            .total-card .big-number { font-size: 2.4rem; }
            .results-table th, .results-table td { padding: 0.5rem 0.4rem; }
            .results-table th { font-size: 0.65rem; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Magnolia Plant Counter</h1>
        <p>Upload drone images &bull; YOLOv8n + ONNX Runtime &bull; Multi-scale tiled inference</p>
    </header>

    <div class="model-status loading" id="modelStatus">Loading model (~12 MB)...</div>

    <div class="upload-area" id="uploadArea">
        <input type="file" id="fileInput" accept="image/*" multiple>
        <div class="upload-icon">📁</div>
        <h2>Drop images here or click to browse</h2>
        <p>JPG, PNG, TIFF &mdash; multiple files supported</p>
    </div>

    <div class="file-list" id="fileList"></div>

    <div class="btn-row">
        <button class="btn" id="countBtn" disabled>
            <span id="btnIcon">🔬</span>
            <span id="btnText">Count Plants</span>
        </button>
    </div>

    <div class="progress-section" id="progressSection">
        <div class="progress-bar"><div class="fill" id="progressFill"></div></div>
        <div class="status-text" id="statusText"></div>
    </div>

    <div class="results-section" id="resultsSection">
        <div class="total-card">
            <div class="big-number" id="totalCount">0</div>
            <div class="label">Total Plants Detected</div>
            <div class="sub" id="totalSub"></div>
            <div class="mode-badge" id="modeBadge"></div>
        </div>
        <div class="results-table">
            <table>
                <thead>
                    <tr>
                        <th>Image</th>
                        <th>Tile 1024</th>
                        <th>Tile 640</th>
                        <th>Best</th>
                        <th>Selected</th>
                    </tr>
                </thead>
                <tbody id="resultsBody"></tbody>
            </table>
        </div>

        <div class="pipeline-info" id="pipelineInfo"></div>

        <div class="annotated-images" id="annotatedImages"></div>
    </div>
</div>

<script>
// ── Config ─────────────────────────────────────────────────
const MODEL_URL       = "best.onnx";
const INPUT_SIZE      = 640;   // YOLOv8n expects 640x640

// Tile sizes to try — each runs the full pipeline independently
const TILE_CONFIGS = [
    { tileSize: 1024, overlap: 205, label: "1024×1024" },
    { tileSize: 640,  overlap: 128, label: "640×640" },
];

const CONF            = 0.5;
const NMS_IOU         = 0.3;
const MIN_CENTER_DIST = 300;

let session = null;

// ── DOM refs ───────────────────────────────────────────────
const fileInput      = document.getElementById("fileInput");
const uploadArea     = document.getElementById("uploadArea");
const fileList       = document.getElementById("fileList");
const countBtn       = document.getElementById("countBtn");
const btnText        = document.getElementById("btnText");
const btnIcon        = document.getElementById("btnIcon");
const progressSection = document.getElementById("progressSection");
const progressFill   = document.getElementById("progressFill");
const statusText     = document.getElementById("statusText");
const resultsSection = document.getElementById("resultsSection");
const resultsBody    = document.getElementById("resultsBody");
const totalCount     = document.getElementById("totalCount");
const totalSub       = document.getElementById("totalSub");
const modelStatus    = document.getElementById("modelStatus");
const modeBadge      = document.getElementById("modeBadge");
const pipelineInfo   = document.getElementById("pipelineInfo");

let selectedFiles = [];

// ── Load ONNX model ────────────────────────────────────────
async function loadModel() {
    try {
        ort.env.wasm.wasmPaths = "https://cdnjs.cloudflare.com/ajax/libs/onnxruntime-web/1.17.3/";
        ort.env.wasm.numThreads = 1;
        session = await ort.InferenceSession.create(MODEL_URL, {
            executionProviders: ["wasm"],
            graphOptimizationLevel: "all",
        });
        modelStatus.textContent = "Model loaded — ready to count plants";
        modelStatus.className = "model-status ready";
        updateButtonState();
    } catch (e) {
        modelStatus.textContent = "Failed to load model: " + e.message;
        modelStatus.className = "model-status error";
        console.error("Model load error:", e);
    }
}
loadModel();

// ── File handling ──────────────────────────────────────────
uploadArea.addEventListener("dragover", e => { e.preventDefault(); uploadArea.classList.add("dragover"); });
uploadArea.addEventListener("dragleave", () => uploadArea.classList.remove("dragover"));
uploadArea.addEventListener("drop", e => { e.preventDefault(); uploadArea.classList.remove("dragover"); addFiles(e.dataTransfer.files); });
fileInput.addEventListener("change", () => { addFiles(fileInput.files); fileInput.value = ""; });

function addFiles(files) {
    for (const f of files) {
        if (!selectedFiles.some(s => s.name === f.name && s.size === f.size)) {
            selectedFiles.push(f);
        }
    }
    renderFileList();
    updateButtonState();
}

function renderFileList() {
    fileList.innerHTML = selectedFiles.map((f, i) =>
        `<span class="file-chip">${f.name}<span class="remove" onclick="removeFile(${i})">&times;</span></span>`
    ).join("");
}

function removeFile(i) {
    selectedFiles.splice(i, 1);
    renderFileList();
    updateButtonState();
}

function updateButtonState() {
    countBtn.disabled = selectedFiles.length === 0 || !session;
}

// ── Image loading helper ───────────────────────────────────
function loadImage(file) {
    return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.src = URL.createObjectURL(file);
    });
}

// ── Tiling ─────────────────────────────────────────────────
function tileImage(canvas, tileSize, overlap) {
    const w = canvas.width, h = canvas.height;
    const stride = tileSize - overlap;
    const tiles = [];

    for (let row = 0; row < h; row += stride) {
        for (let col = 0; col < w; col += stride) {
            const rEnd = Math.min(row + tileSize, h);
            const cEnd = Math.min(col + tileSize, w);
            const tileCanvas = document.createElement("canvas");
            tileCanvas.width = tileSize;
            tileCanvas.height = tileSize;
            const tileCtx = tileCanvas.getContext("2d");
            tileCtx.fillStyle = "rgb(114,114,114)";
            tileCtx.fillRect(0, 0, tileSize, tileSize);
            tileCtx.drawImage(canvas, col, row, cEnd - col, rEnd - row, 0, 0, cEnd - col, rEnd - row);
            tiles.push({ canvas: tileCanvas, row, col });
        }
    }
    return tiles;
}

// ── Preprocessing: tile canvas → ONNX tensor ──────────────
function preprocessTile(tileCanvas, inputSize) {
    const resized = document.createElement("canvas");
    resized.width = inputSize;
    resized.height = inputSize;
    const rCtx = resized.getContext("2d", { willReadFrequently: true });
    rCtx.fillStyle = "rgb(114,114,114)";
    rCtx.fillRect(0, 0, inputSize, inputSize);
    rCtx.drawImage(tileCanvas, 0, 0, inputSize, inputSize);
    const imgData = rCtx.getImageData(0, 0, inputSize, inputSize).data;
    const float32 = new Float32Array(3 * inputSize * inputSize);
    for (let i = 0; i < inputSize * inputSize; i++) {
        float32[i]                              = imgData[i * 4]     / 255.0;
        float32[i + inputSize * inputSize]      = imgData[i * 4 + 1] / 255.0;
        float32[i + 2 * inputSize * inputSize]  = imgData[i * 4 + 2] / 255.0;
    }
    return new ort.Tensor("float32", float32, [1, 3, inputSize, inputSize]);
}

// ── Parse YOLOv8 output ───────────────────────────────────
function parseYOLOv8Output(output, tileRow, tileCol, tileSize, inputSize, confThresh) {
    const data = output.data;
    const numDetections = output.dims[2]; // 8400
    const boxes = [];
    const scale = tileSize / inputSize;

    for (let i = 0; i < numDetections; i++) {
        const conf = data[4 * numDetections + i];
        if (conf < confThresh) continue;
        let cx = data[0 * numDetections + i] * scale + tileCol;
        let cy = data[1 * numDetections + i] * scale + tileRow;
        let w  = data[2 * numDetections + i] * scale;
        let h  = data[3 * numDetections + i] * scale;
        boxes.push([cx, cy, w, h, conf]);
    }
    return boxes;
}

// ── NMS ────────────────────────────────────────────────────
function computeIoU(b1, b2) {
    const x1_1 = b1[0] - b1[2] / 2, y1_1 = b1[1] - b1[3] / 2;
    const x2_1 = b1[0] + b1[2] / 2, y2_1 = b1[1] + b1[3] / 2;
    const x1_2 = b2[0] - b2[2] / 2, y1_2 = b2[1] - b2[3] / 2;
    const x2_2 = b2[0] + b2[2] / 2, y2_2 = b2[1] + b2[3] / 2;
    const inter = Math.max(0, Math.min(x2_1, x2_2) - Math.max(x1_1, x1_2)) *
                  Math.max(0, Math.min(y2_1, y2_2) - Math.max(y1_1, y1_2));
    const union = b1[2] * b1[3] + b2[2] * b2[3] - inter;
    return union > 0 ? inter / union : 0;
}

function nmsBoxes(boxes, iouThreshold) {
    if (!boxes.length) return [];
    boxes.sort((a, b) => b[4] - a[4]);
    const keep = [];
    while (boxes.length) {
        const best = boxes.shift();
        keep.push(best);
        boxes = boxes.filter(b => computeIoU(best, b) < iouThreshold);
    }
    return keep;
}

// ── Center-distance dedup ──────────────────────────────────
function centerDistanceDedup(boxes, minDist) {
    if (!boxes.length) return [];
    boxes.sort((a, b) => b[4] - a[4]);
    const keep = [];
    for (const box of boxes) {
        let tooClose = false;
        for (const kept of keep) {
            const dist = Math.sqrt((box[0] - kept[0]) ** 2 + (box[1] - kept[1]) ** 2);
            if (dist < minDist) { tooClose = true; break; }
        }
        if (!tooClose) keep.push(box);
    }
    return keep;
}

// ── Run tiled pipeline for one tile config ─────────────────
async function runTiledPipeline(sourceCanvas, tileSize, overlap, onProgress) {
    const tiles = tileImage(sourceCanvas, tileSize, overlap);
    let allBoxes = [];

    for (let t = 0; t < tiles.length; t++) {
        const { canvas: tileCanvas, row, col } = tiles[t];
        const tensor = preprocessTile(tileCanvas, INPUT_SIZE);
        const inputName = session.inputNames[0];
        const results = await session.run({ [inputName]: tensor });
        const output = results[session.outputNames[0]];
        const boxes = parseYOLOv8Output(output, row, col, tileSize, INPUT_SIZE, CONF);
        allBoxes = allBoxes.concat(boxes);
        if (onProgress) onProgress(t + 1, tiles.length);
    }

    const rawCount = allBoxes.length;
    const afterNms = nmsBoxes(allBoxes, NMS_IOU);
    const afterDedup = centerDistanceDedup(afterNms, MIN_CENTER_DIST);

    return {
        tileSize,
        tilesProcessed: tiles.length,
        rawDetections: rawCount,
        afterNms: afterNms.length,
        plantCount: afterDedup.length,
        boxes: afterDedup,
    };
}

// ── Process one image with all tile configs ────────────────
async function processImage(file, onProgress) {
    const img = await loadImage(file);

    const canvas = document.createElement("canvas");
    canvas.width = img.naturalWidth;
    canvas.height = img.naturalHeight;
    canvas.getContext("2d").drawImage(img, 0, 0);
    URL.revokeObjectURL(img.src);

    // Count total tiles across all configs for progress
    const allTileCounts = TILE_CONFIGS.map(cfg => {
        const stride = cfg.tileSize - cfg.overlap;
        const cols = Math.ceil(canvas.width / stride);
        const rows = Math.ceil(canvas.height / stride);
        return cols * rows;
    });
    const grandTotal = allTileCounts.reduce((a, b) => a + b, 0);
    let completed = 0;

    const pipelineResults = [];

    for (let c = 0; c < TILE_CONFIGS.length; c++) {
        const cfg = TILE_CONFIGS[c];
        const result = await runTiledPipeline(canvas, cfg.tileSize, cfg.overlap, (done, total) => {
            if (onProgress) onProgress(completed + done, grandTotal, cfg.label);
        });
        result.label = cfg.label;
        pipelineResults.push(result);
        completed += allTileCounts[c];
    }

    // Pick the best: highest plant count wins
    let bestIdx = 0;
    for (let i = 1; i < pipelineResults.length; i++) {
        if (pipelineResults[i].plantCount > pipelineResults[bestIdx].plantCount) {
            bestIdx = i;
        }
    }

    const best = pipelineResults[bestIdx];

    return {
        filename: file.name,
        pipelineResults,
        bestIdx,
        plantCount: best.plantCount,
        boxes: best.boxes,
        selectedTile: best.label,
        sourceCanvas: canvas,
    };
}

// ── Draw annotated image ──────────────────────────────────
function drawAnnotatedImage(sourceCanvas, boxes) {
    const annoCanvas = document.createElement("canvas");
    annoCanvas.width = sourceCanvas.width;
    annoCanvas.height = sourceCanvas.height;
    const ctx = annoCanvas.getContext("2d");

    ctx.drawImage(sourceCanvas, 0, 0);

    const shortSide = Math.min(sourceCanvas.width, sourceCanvas.height);
    const lineWidth = Math.max(2, Math.round(shortSide / 500));
    const fontSize = Math.max(12, Math.round(shortSide / 300));

    ctx.strokeStyle = "#00FF00";
    ctx.lineWidth = lineWidth;
    ctx.font = `bold ${fontSize}px sans-serif`;

    for (const [cx, cy, w, h, conf] of boxes) {
        const x1 = cx - w / 2;
        const y1 = cy - h / 2;

        ctx.strokeRect(x1, y1, w, h);

        const label = `${(conf * 100).toFixed(0)}%`;
        const textWidth = ctx.measureText(label).width;
        const labelH = fontSize + 4;
        ctx.fillStyle = "rgba(0, 180, 0, 0.7)";
        ctx.fillRect(x1, y1 - labelH, textWidth + 6, labelH);
        ctx.fillStyle = "#fff";
        ctx.fillText(label, x1 + 3, y1 - 4);
    }

    const countLabel = `${boxes.length} plants detected`;
    const wmFontSize = Math.max(16, Math.round(shortSide / 150));
    ctx.font = `bold ${wmFontSize}px sans-serif`;
    const wmPad = Math.round(wmFontSize * 0.6);
    const wmTextWidth = ctx.measureText(countLabel).width;
    ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
    ctx.fillRect(wmPad, wmPad, wmTextWidth + wmPad * 2, wmFontSize + wmPad);
    ctx.fillStyle = "#00FF00";
    ctx.fillText(countLabel, wmPad * 2, wmPad + wmFontSize - 2);

    return annoCanvas;
}

// ── Count button handler ───────────────────────────────────
countBtn.addEventListener("click", async () => {
    if (selectedFiles.length === 0 || !session) return;

    countBtn.disabled = true;
    btnText.textContent = "Processing...";
    btnIcon.textContent = "⏳";
    progressSection.style.display = "block";
    resultsSection.style.display = "none";

    const results = [];
    let totalPlants = 0;

    for (let f = 0; f < selectedFiles.length; f++) {
        const file = selectedFiles[f];

        try {
            const result = await processImage(file, (done, total, currentLabel) => {
                const imageBase = f / selectedFiles.length;
                const imageProgress = imageBase + (done / total) / selectedFiles.length;
                progressFill.style.width = (imageProgress * 100).toFixed(1) + "%";
                statusText.textContent = `Image ${f + 1}/${selectedFiles.length}: ${file.name} — ${currentLabel} tile ${done}/${total}`;
            });
            results.push(result);
            totalPlants += result.plantCount;
        } catch (err) {
            results.push({ filename: file.name, error: err.message, plantCount: 0 });
            console.error("Error processing", file.name, err);
        }
    }

    // Show results
    progressFill.style.width = "100%";
    statusText.textContent = "Done! Drawing annotations...";

    totalCount.textContent = totalPlants.toLocaleString();
    totalSub.textContent = `across ${results.length} image(s)`;
    modeBadge.textContent = "Multi-scale: best of " + TILE_CONFIGS.map(c => c.label).join(" vs ");

    resultsBody.innerHTML = results.map(r => {
        if (r.error) {
            return `<tr><td>${r.filename}</td><td colspan="3" style="color:#c44;font-size:0.8rem">${r.error}</td><td>—</td></tr>`;
        }
        const p = r.pipelineResults;
        // Find which indices correspond to 1024 and 640
        const r1024 = p.find(x => x.tileSize === 1024);
        const r640  = p.find(x => x.tileSize === 640);
        return `<tr>
            <td>${r.filename}</td>
            <td class="meta ${r.selectedTile === '1024×1024' ? 'winner' : ''}">${r1024 ? r1024.plantCount : '—'} <span style="font-size:0.65rem;color:#aaa">(${r1024 ? r1024.tilesProcessed : 0}t)</span></td>
            <td class="meta ${r.selectedTile === '640×640' ? 'winner' : ''}">${r640 ? r640.plantCount : '—'} <span style="font-size:0.65rem;color:#aaa">(${r640 ? r640.tilesProcessed : 0}t)</span></td>
            <td class="count-cell">${r.plantCount.toLocaleString()}</td>
            <td class="meta">${r.selectedTile}</td>
        </tr>`;
    }).join("");

    // Pipeline explanation
    const selectionSummary = results.filter(r => !r.error).map(r => {
        return `<strong>${r.filename}</strong>: ${r.selectedTile} selected (${r.pipelineResults.map(p => `${p.label}=${p.plantCount}`).join(", ")})`;
    }).join("<br>");
    pipelineInfo.innerHTML = `<strong>How it works:</strong> Each image is tiled at two scales (1024×1024 and 640×640). Both go through NMS + center-distance dedup independently. The tile size yielding the highest plant count is selected as the final result — larger tiles work well for spaced-out plants, smaller tiles catch densely packed ones.<br><br>${selectionSummary}`;

    // Draw annotated images
    const annotatedContainer = document.getElementById("annotatedImages");
    annotatedContainer.innerHTML = "";

    for (const r of results) {
        if (r.error || !r.sourceCanvas) continue;

        const annoCanvas = drawAnnotatedImage(r.sourceCanvas, r.boxes);

        const card = document.createElement("div");
        card.className = "annotated-card";

        const header = document.createElement("div");
        header.className = "card-header";
        header.innerHTML = `<h3>${r.filename}</h3><span class="badge">${r.plantCount} plants</span><span class="tile-badge">${r.selectedTile}</span>`;

        const body = document.createElement("div");
        body.className = "card-body";
        body.appendChild(annoCanvas);

        const dlBtn = document.createElement("a");
        dlBtn.className = "download-btn";
        dlBtn.textContent = "⬇ Download annotated image";
        dlBtn.download = r.filename.replace(/\.[^.]+$/, "") + "_annotated.jpg";
        dlBtn.href = annoCanvas.toDataURL("image/jpeg", 0.92);
        body.appendChild(dlBtn);

        card.appendChild(header);
        card.appendChild(body);
        annotatedContainer.appendChild(card);
    }

    statusText.textContent = "Done!";
    resultsSection.style.display = "block";

    btnText.textContent = "Count Plants";
    btnIcon.textContent = "🔬";
    countBtn.disabled = false;

    setTimeout(() => {
        progressSection.style.display = "none";
        progressFill.style.width = "0%";
    }, 2000);
});
</script>

</body>
</html>
